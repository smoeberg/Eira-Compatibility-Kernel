name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [api, bff, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -f apps/${{ matrix.image }}/Dockerfile -t eck-${{ matrix.image }}:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (smoke)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres api bff
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T bff node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

      - name: Container diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=100 api bff

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
